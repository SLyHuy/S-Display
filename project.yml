name: S-Display
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The real version comes from the release tag: scripts/release.sh passes it to
    # xcodebuild. These defaults only show up in builds made straight from Xcode.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  S-Display:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: S-Display
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(PRODUCT_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Huy Ly. MIT License."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Private SkyLight calls and privileged writes to /Library/Displays need no sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
        DEAD_CODE_STRIPPING: YES

  S-DisplayTests:
    type: bundle.unit-test
    platform: macOS
    # Tests compile the pure logic directly instead of hosting the menu bar app,
    # so running them never touches the real displays.
    sources:
      - path: S-DisplayTests
      - path: S-Display/Logic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huyly.sdisplay.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"

schemes:
  S-Display:
    build:
      targets:
        S-Display: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - S-DisplayTests
    archive:
      config: Release
