name: S-Display
options:
  bundleIdPrefix: com.slyhuy
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Personal build: ad-hoc signed ("Sign to Run Locally"), no team needed.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  S-Display:
    type: application
    platform: macOS
    sources:
      - path: S-Display
    settings:
      base:
        PRODUCT_NAME: S-Display
        PRODUCT_BUNDLE_IDENTIFIER: com.slyhuy.SDisplay
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: S-Display
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "S-Display — BlackOut and Flexible HiDPI for macOS"
        # Private SkyLight calls and privileged writes to /Library/Displays need no sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
        DEAD_CODE_STRIPPING: YES

  S-DisplayTests:
    type: bundle.unit-test
    platform: macOS
    # Tests compile the pure logic directly instead of hosting the menu bar app,
    # so running them never touches the real displays.
    sources:
      - path: S-DisplayTests
      - path: S-Display/Logic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slyhuy.SDisplayTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  S-Display:
    build:
      targets:
        S-Display: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - S-DisplayTests
