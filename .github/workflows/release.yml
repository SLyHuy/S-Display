# Publishes a release built on GitHub's own machines, with a build attestation so anyone
# can check a download came from this repository:
#   gh attestation verify S-Display-1.2.3.dmg -R SLyHuy/S-Display
#
# Usual way: Actions → Release → Run workflow on main, pick patch / minor / major.
# The next version is worked out from the latest v* tag; the tag is created by the
# release itself, so no version-bump commit is needed. Pushing a v1.2.3 tag by hand
# also works (as long as the tagged commit is on main).
#
# Release notes = optional highlights typed in the Run workflow form
#               + the merged pull requests since the last release, grouped by label
#                 (.github/release.yml)
#               + install and verification instructions (.github/release-notes.md).
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise (1.2.3 → patch 1.2.4, minor 1.3.0, major 2.0.0)
        type: choice
        options: [patch, minor, major]
        default: patch
      highlights:
        description: Highlights (optional), one sentence for users, shown at the top of the release notes
        type: string
        required: false
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    permissions:
      contents: write      # create the tag and the GitHub Release
      id-token: write      # sign the build attestation
      attestations: write  # store the build attestation
    outputs:
      version: ${{ steps.version.outputs.version }}
      dmg_sha256: ${{ steps.publish.outputs.dmg_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # all tags and history: version and build number come from them
          persist-credentials: false  # never leave GITHUB_TOKEN in .git/config during build/test

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
              echo "Tagged commit $GITHUB_SHA is not on main" >&2
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Run the release from main, not $GITHUB_REF" >&2
              exit 1
            fi
            LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST:-v0.0.0}"
            MAJOR="${MAJOR#v}"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "Tag v$VERSION already exists" >&2
              exit 1
            fi
            echo "Latest release ${LATEST:-none} → $BUMP → v$VERSION"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen (pinned, checksum verified)
        run: ./scripts/install-xcodegen.sh

      - name: Test, build and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          HIGHLIGHTS: ${{ inputs.highlights }}
        run: |
          # Merged pull requests since the previous release, grouped by .github/release.yml.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
            -f configuration_file_path=.github/release.yml --jq .body \
            > "$RUNNER_TEMP/changes.md"
          {
            if [ -n "$HIGHLIGHTS" ]; then
              printf '## Highlights\n%s\n\n' "$HIGHLIGHTS"
            fi
            cat "$RUNNER_TEMP/changes.md"
            printf '\n\n'
            sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DMG_SHA256=$(awk -v f="S-Display-$VERSION.dmg" '$2 == f { print $1 }' "dist/S-Display-$VERSION.sha256")
          if ! [[ "$DMG_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not read SHA-256 for S-Display-$VERSION.dmg" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG_ARGS=(--verify-tag)             # the pushed tag already exists
          else
            TAG_ARGS=(--target "$GITHUB_SHA")   # create the tag on the commit just built
          fi
          gh release create "v$VERSION" \
            "dist/S-Display-$VERSION.dmg" "dist/S-Display-$VERSION.zip" "dist/S-Display-$VERSION.sha256" \
            --title "S-Display $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${TAG_ARGS[@]}"
          echo "dmg_sha256=$DMG_SHA256" >> "$GITHUB_OUTPUT"

  update-homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Update Casks/s-display.rb via GitHub Contents API
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.dmg_sha256 }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not set; skipping SLyHuy/homebrew-tap update for v$VERSION."
            exit 0
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid version or SHA-256 output from release job" >&2
            exit 1
          fi

          # Cross-check against the actual published GitHub Release asset digest.
          RELEASE_DIGEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" \
            --jq ".assets[] | select(.name == \"S-Display-$VERSION.dmg\") | .digest")
          if [ "$RELEASE_DIGEST" != "sha256:$SHA256" ]; then
            echo "Published asset digest ($RELEASE_DIGEST) does not match expected sha256:$SHA256" >&2
            exit 1
          fi

          CASK_JSON="$RUNNER_TEMP/cask.json"
          CASK_ORIGINAL="$RUNNER_TEMP/s-display.orig.rb"
          CASK_UPDATED="$RUNNER_TEMP/s-display.rb"
          PAYLOAD_JSON="$RUNNER_TEMP/payload.json"

          gh api repos/SLyHuy/homebrew-tap/contents/Casks/s-display.rb > "$CASK_JSON"
          FILE_SHA=$(jq -r .sha "$CASK_JSON")
          if ! [[ "$FILE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid blob SHA from SLyHuy/homebrew-tap" >&2
            exit 1
          fi

          jq -r .content "$CASK_JSON" | tr -d '\n' | base64 --decode > "$CASK_ORIGINAL"
          cp "$CASK_ORIGINAL" "$CASK_UPDATED"
          ./scripts/update-homebrew-cask.sh "$VERSION" "$SHA256" "$CASK_UPDATED"

          if cmp -s "$CASK_ORIGINAL" "$CASK_UPDATED"; then
            echo "Homebrew cask is already up to date at $VERSION"
            exit 0
          fi

          UPDATED_B64=$(base64 < "$CASK_UPDATED" | tr -d '\n')
          jq -n \
            --arg message "s-display $VERSION" \
            --arg content "$UPDATED_B64" \
            --arg sha "$FILE_SHA" \
            --arg branch "main" \
            '{message: $message, content: $content, sha: $sha, branch: $branch}' > "$PAYLOAD_JSON"

          gh api --method PUT repos/SLyHuy/homebrew-tap/contents/Casks/s-display.rb \
            --input "$PAYLOAD_JSON" >/dev/null
          echo "Updated SLyHuy/homebrew-tap Casks/s-display.rb to $VERSION ($SHA256)"
