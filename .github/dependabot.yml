# Keeps the GitHub Actions used by the workflows up to date. They are pinned to commit
# SHAs, so they never change on their own; Dependabot opens a pull request (checked by
# CI) when a new version is out. S-Display has no other dependencies.
# The pinned XcodeGen in scripts/install-xcodegen.sh is updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
